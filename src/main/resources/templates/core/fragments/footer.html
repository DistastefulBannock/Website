<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
<div th:fragment="footer" id="footer">
    <div id="copyright">
        <span th:if="!${#dates.format(#dates.createNow(), 'yyyy').toString().equals('2024')}">
            © 2024 - [[${#dates.format(#dates.createNow(), 'yyyy')}]] DistastefulBannock
        </span>
        <span th:unless="!${#dates.format(#dates.createNow(), 'yyyy').toString().equals('2024')}">
            © 2024 DistastefulBannock
        </span>
        <span><img th:src="@{/resources/core/img/pyramids of power.gif}" alt="pyramids of power"/></span>
    </div>
    <th:block th:if="${mossadTrackingToken != null}">
        <!-- We put the tracking at the end because tracking is less important than UX -->
        <!-- (It's really to distract you from the crypto miner we have) -->
        <script th:src="@{/resources/analytics/js/mossadTracking.js}"></script>
        <script>
            callTheHiddenPalantirEndpointSoWeCanSubmitAllTheUserDataToMossad("[[${mossadTrackingToken}]]");
        </script>
    </th:block>
</div>
</body>
</html>
