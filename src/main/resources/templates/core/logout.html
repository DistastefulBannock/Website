<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{core/fragments/main.html :: main}"></div>
    <title>Logout</title>
</head>
<body>

<div th:replace="~{core/fragments/header.html :: header}"></div>

<form method="POST" th:action="@{/core/logout}" style="display: flex; flex-direction: column; align-items: center;">
    <h2>Are you sure that you wish to log out?</h2>
    <input id="logoutSubmit" type="submit" value="YES" style="font-size: 2em;">
</form>

<div th:replace="~{core/fragments/footer.html :: footer}"></div>

</body>
</html>
